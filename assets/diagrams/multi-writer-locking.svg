<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="locking-title locking-desc" role="img" viewBox="0 0 1200 480"><title id="locking-title">Multi-writer safety: per-file advisory locking via wiki-lock.sh</title><desc id="locking-desc">Diagram showing two parallel ingest writers attempting to acquire a lock on the same wiki page. The lock manager grants one writer access while the other waits and retries on the next pass, preventing corruption.</desc><defs><marker id="arrow2" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#475569" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-amber" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#d97706" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="1200" height="480" fill="#fff"/><text x="600" y="32" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Multi-writer safety: per-file advisory locks (v1.7+)</text><text x="600" y="54" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Closes the latent corruption hole when parallel agents target the same page.</text><rect width="200" height="90" x="40" y="100" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="10"/><text x="140" y="130" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Writer A</text><text x="140" y="152" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">/wiki-ingest sub-agent</text><text x="140" y="170" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle">processing source-1.md</text><rect width="200" height="90" x="40" y="320" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="10"/><text x="140" y="350" fill="#92400e" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Writer B</text><text x="140" y="372" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">/wiki-ingest sub-agent</text><text x="140" y="390" fill="#d97706" font-family="system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle">processing source-2.md</text><line x1="240" x2="400" y1="145" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/><text x="290" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">acquire wiki/concepts/Foo.md</text><line x1="240" x2="400" y1="365" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/><text x="290" y="335" fill="#475569" font-family="system-ui, sans-serif" font-size="11">acquire wiki/concepts/Foo.md</text><rect width="280" height="120" x="400" y="180" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" rx="10"/><text x="540" y="212" fill="#5b21b6" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">scripts/wiki-lock.sh</text><text x="540" y="236" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">atomic acquire / release</text><text x="540" y="254" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">.vault-meta/locks/&lt;hash&gt;.lock</text><text x="540" y="276" fill="#7c3aed" font-family="system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle">stale reap: 60s default</text><line x1="680" x2="800" y1="210" y2="160" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/><text x="720" y="178" fill="#15803d" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ granted</text><line x1="680" x2="800" y1="270" y2="340" stroke="#d97706" stroke-dasharray="5 4" stroke-width="2.5" marker-end="url(#arrow-amber)"/><text x="700" y="320" fill="#b45309" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✗ waits + retries</text><rect width="350" height="120" x="800" y="100" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="10"/><text x="975" y="130" fill="#15803d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Writer A writes the page</text><text x="975" y="155" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Write/Edit via selected transport</text><text x="975" y="173" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">(Obsidian CLI / MCP / filesystem)</text><text x="975" y="195" fill="#16a34a" font-family="system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle">then releases the lock</text><rect width="350" height="130" x="800" y="290" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="10"/><text x="975" y="320" fill="#92400e" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Writer B logs the skip</text><text x="975" y="346" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">wiki/log.md gets a skip-line</text><text x="975" y="364" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Page picked up on next pass</text><text x="975" y="390" fill="#d97706" font-family="system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle">No corruption. No half-written page.</text><text x="600" y="450" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">PostToolUse hook checks the lock list before auto-committing. Active locks defer the commit.</text><text x="600" y="466" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Path validation rejects absolute paths, `..` segments, newlines, NUL bytes. Tests: 22 assertions across test_wiki_lock.sh + test_concurrent_write.sh</text></svg>