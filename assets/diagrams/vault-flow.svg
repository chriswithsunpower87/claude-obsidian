<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="vault-flow-title vault-flow-desc" role="img" viewBox="0 0 1200 420"><title id="vault-flow-title">claude-obsidian vault flow: sources to ingest to wiki pages to index to query</title><desc id="vault-flow-desc">Horizontal architecture diagram showing source documents flowing into the wiki-ingest agent, which extracts entities, concepts, and sources into the wiki. The index is updated, and the wiki-query interface answers questions by reading the hot cache, index, and pages in order.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#475569" d="M 0 0 L 10 5 L 0 10 z"/></marker><linearGradient id="bg-card" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fafafa"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient></defs><rect width="1200" height="420" fill="#fff"/><text x="600" y="30" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Vault flow: from raw source to cited answer</text><rect width="170" height="90" x="40" y="160" fill="url(#bg-card)" stroke="#3b82f6" stroke-width="2" rx="10"/><text x="125" y="195" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">.raw/ sources</text><text x="125" y="218" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">PDFs · markdown</text><text x="125" y="234" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">URLs · transcripts</text><line x1="210" x2="270" y1="205" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="200" height="110" x="270" y="150" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" rx="10"/><text x="370" y="180" fill="#5b21b6" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">/wiki-ingest</text><text x="370" y="202" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">read · extract entities</text><text x="370" y="218" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">extract concepts</text><text x="370" y="234" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">cross-reference</text><text x="370" y="250" fill="#7c3aed" font-family="system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle">acquires wiki-lock per page</text><line x1="470" x2="540" y1="180" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="470" x2="540" y1="205" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="470" x2="540" y1="230" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="170" height="60" x="540" y="95" fill="#ecfeff" stroke="#06b6d4" stroke-width="2" rx="8"/><text x="625" y="120" fill="#155e75" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">wiki/entities/</text><text x="625" y="140" fill="#475569" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">people · orgs · products</text><rect width="170" height="60" x="540" y="175" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="8"/><text x="625" y="200" fill="#166534" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">wiki/concepts/</text><text x="625" y="220" fill="#475569" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">ideas · patterns · frameworks</text><rect width="170" height="60" x="540" y="255" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/><text x="625" y="280" fill="#92400e" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">wiki/sources/</text><text x="625" y="300" fill="#475569" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">source summaries</text><line x1="710" x2="770" y1="125" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="710" x2="770" y1="205" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="710" x2="770" y1="285" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="180" height="90" x="770" y="160" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="10"/><text x="860" y="190" fill="#991b1b" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">wiki/index.md</text><text x="860" y="212" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">master catalog</text><text x="860" y="228" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">+ wiki/hot.md cache</text><text x="860" y="244" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle">+ wiki/log.md append</text><line x1="950" x2="1010" y1="205" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="150" height="110" x="1010" y="150" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="10"/><text x="1085" y="180" fill="#92400e" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">/wiki-query</text><text x="1085" y="202" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">read hot</text><text x="1085" y="218" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">read index</text><text x="1085" y="234" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">read pages</text><text x="1085" y="250" fill="#b45309" font-family="system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle">synthesize + cite</text><text x="600" y="365" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Every page is gated by per-file advisory locks (v1.7+). Mode router (v1.8+) picks the destination folder per active methodology.</text><text x="600" y="385" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Hot cache is refreshed on Stop hook. Index + log update atomically. Compounds with every ingest.</text></svg>