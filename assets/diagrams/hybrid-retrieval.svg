<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="retrieval-title retrieval-desc" role="img" viewBox="0 0 1200 480"><title id="retrieval-title">Hybrid retrieval pipeline: BM25 + contextual prefix + cosine rerank</title><desc id="retrieval-desc">Pipeline diagram showing user query feeding BM25 sparse search and an optional contextual-prefix Anthropic API call. Both feed a cosine rerank via local ollama embeddings. The output is a ranked list of candidate pages with traceability via --explain.</desc><defs><marker id="arrow3" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#475569" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="1200" height="480" fill="#fff"/><text x="600" y="32" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Hybrid retrieval pipeline (v1.7+, opt-in via setup-retrieve.sh)</text><text x="600" y="54" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Anthropic Sept 2024 contextual retrieval pattern. Local-by-default. Measured +32pp top-1 over v1.6 baseline.</text><rect width="170" height="80" x="40" y="200" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="10"/><text x="125" y="230" fill="#92400e" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">User query</text><text x="125" y="252" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">&quot;what do you know</text><text x="125" y="268" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">about hot cache?&quot;</text><line x1="210" x2="330" y1="220" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/><line x1="210" x2="330" y1="260" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/><rect width="220" height="100" x="330" y="100" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="10"/><text x="440" y="128" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">BM25 sparse search</text><text x="440" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">scripts/bm25-index.py</text><text x="440" y="168" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Unicode tokenizer · idf scoring</text><text x="440" y="186" fill="#2563eb" font-family="system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle">~50 candidates</text><rect width="220" height="120" x="330" y="300" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="10"/><text x="440" y="328" fill="#991b1b" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Contextual prefix</text><text x="440" y="350" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">scripts/contextual-prefix.py</text><text x="440" y="368" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Anthropic API (opt-in)</text><text x="440" y="386" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle">requires --allow-egress</text><text x="440" y="405" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle">falls back to synthetic if denied</text><line x1="550" x2="700" y1="150" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/><line x1="550" x2="700" y1="360" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/><rect width="220" height="100" x="700" y="200" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" rx="10"/><text x="810" y="228" fill="#5b21b6" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Cosine rerank</text><text x="810" y="250" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">scripts/rerank.py</text><text x="810" y="268" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">ollama nomic-embed (local)</text><text x="810" y="286" fill="#7c3aed" font-family="system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle">cached in .vault-meta/</text><line x1="920" x2="1010" y1="250" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/><rect width="160" height="100" x="1010" y="200" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="10"/><text x="1090" y="228" fill="#15803d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Top-K candidates</text><text x="1090" y="250" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">page paths</text><text x="1090" y="268" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">snippets · scores</text><text x="1090" y="286" fill="#16a34a" font-family="system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle">--explain traces each</text><text x="600" y="445" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">BM25 always runs. Prefix tier is opt-in (consent-gated). Rerank is local-only by default; --allow-remote-ollama to point elsewhere.</text><text x="600" y="463" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Pipeline degrades gracefully: if rerank is unavailable, BM25-only results return with rerank_source=&quot;skipped&quot;.</text></svg>