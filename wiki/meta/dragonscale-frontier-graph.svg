<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" font-family="Space Grotesk, system-ui, -apple-system, sans-serif" viewBox="0 0 900 500"><rect width="900" height="500" fill="#0A0A0A"/><text x="450" y="36" fill="#F5F5F0" font-size="17" font-weight="700" text-anchor="middle">Boundary-first autoresearch in action</text><text x="450" y="56" fill="#888" font-size="11" text-anchor="middle">top-5 frontier from the 2026-04-24 run. Candidate picked, three pages filed.</text><g><text x="60" y="100" fill="#E07850" font-size="11" font-weight="700" letter-spacing="2">TOP-5 FRONTIER</text><rect width="310" height="44" x="50" y="116" fill="#111" stroke="#2D2D2D" stroke-width="1" rx="10"/><text x="70" y="138" fill="#6a6a6a" font-size="10" text-anchor="start">1. Ecosystem Research</text><text x="340" y="138" fill="#6a6a6a" font-size="10" text-anchor="end">4.693</text><text x="70" y="152" fill="#dc2626" font-size="9">skipped: source page</text><rect width="310" height="44" x="50" y="168" fill="#111" stroke="#2D2D2D" stroke-width="1" rx="10"/><text x="70" y="190" fill="#6a6a6a" font-size="10">2. DragonScale Memory</text><text x="340" y="190" fill="#6a6a6a" font-size="10" text-anchor="end">4.000</text><text x="70" y="204" fill="#dc2626" font-size="9">skipped: self-reference</text><rect width="310" height="58" x="50" y="220" fill="#1A1A1A" stroke="#4ADE80" stroke-width="2" rx="10"/><text x="70" y="242" fill="#F5F5F0" font-size="12" font-weight="700">3. How does the LLM Wiki pattern work?</text><text x="340" y="242" fill="#F5F5F0" font-size="11" font-weight="700" text-anchor="end">1.702</text><text x="70" y="258" fill="#4ADE80" font-size="9" font-weight="700" letter-spacing="1">CHOSEN CANDIDATE</text><text x="70" y="271" fill="#888" font-size="9">question page with gap, 6 URLs fetched for extension</text><rect width="310" height="44" x="50" y="286" fill="#111" stroke="#2D2D2D" stroke-width="1" rx="10"/><text x="70" y="308" fill="#888" font-size="10">4. Wiki vs RAG</text><text x="340" y="308" fill="#888" font-size="10" text-anchor="end">1.135</text><text x="70" y="322" fill="#6a6a6a" font-size="9">eligible, not picked this round</text><rect width="310" height="44" x="50" y="338" fill="#111" stroke="#2D2D2D" stroke-width="1" rx="10"/><text x="70" y="360" fill="#888" font-size="10">5. SEO Drift Monitoring</text><text x="340" y="360" fill="#888" font-size="10" text-anchor="end">0.717</text><text x="70" y="374" fill="#6a6a6a" font-size="9">eligible, not picked this round</text><text x="50" y="420" fill="#6a6a6a" font-size="10" font-weight="700">formula</text><text x="50" y="436" fill="#888" font-size="10">score = (out_degree - in_degree) * exp(-age_days / 30)</text><text x="50" y="452" fill="#6a6a6a" font-size="9">halflife 30 days, no floor. 22 scoreable pages. meta excluded.</text></g><g fill="none" stroke="#4ADE80" stroke-width="2"><path marker-end="url(#arrow-green)" d="M 365 249 Q 440 249 520 200"/><path d="M 365 249 Q 440 249 520 249"/><path marker-end="url(#arrow-green)" d="M 365 249 Q 440 249 520 298"/><line x1="519" x2="518" y1="249" y2="250"/></g><defs><marker id="arrow-green" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#4ADE80" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><g><text x="540" y="100" fill="#4ADE80" font-size="11" font-weight="700" letter-spacing="2">PAGES FILED</text><rect width="340" height="54" x="520" y="176" fill="#111" stroke="#4ADE80" stroke-width="1.5" rx="10"/><text x="540" y="198" fill="#F5F5F0" font-size="12" font-weight="700">Persistent Wiki Artifact</text><text x="540" y="214" fill="#888" font-size="9">44 lines · Karpathy gist + Obsidian docs</text><text x="540" y="226" fill="#6a6a6a" font-size="9">durable Markdown layer as the agent&apos;s memory object</text><rect width="340" height="54" x="520" y="238" fill="#111" stroke="#4ADE80" stroke-width="1.5" rx="10"/><text x="540" y="260" fill="#F5F5F0" font-size="12" font-weight="700">Source-First Synthesis</text><text x="540" y="276" fill="#888" font-size="9">42 lines · Karpathy gist + RAG arXiv 2005.11401</text><text x="540" y="288" fill="#6a6a6a" font-size="9">raw sources immutable, synthesis cites them</text><rect width="340" height="54" x="520" y="300" fill="#111" stroke="#4ADE80" stroke-width="1.5" rx="10"/><text x="540" y="322" fill="#F5F5F0" font-size="12" font-weight="700">Query-Time Retrieval</text><text x="540" y="338" fill="#888" font-size="9">44 lines · Karpathy gist + MemGPT arXiv 2310.08560</text><text x="540" y="350" fill="#6a6a6a" font-size="9">wiki query synthesis vs Obsidian in-vault search</text><rect width="340" height="60" x="520" y="400" fill="#1A1A1A" stroke="#E07850" stroke-width="1" rx="10"/><text x="540" y="420" fill="#E07850" font-size="10" font-weight="700" letter-spacing="2">AGENDA CONTROL</text><text x="540" y="436" fill="#888" font-size="9">M4 does not just describe the vault; it shapes what</text><text x="540" y="450" fill="#888" font-size="9">the agent researches next. User picks, overrides, declines.</text></g></svg>